services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cepco_mc2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cepco_mc2"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    # Context is the repo root, not ./backend: the image also needs
    # database/migrations (schema) and assets/ (one-time CSV import).
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cepco_mc2
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Storage: "local" (container disk, dev only) or "gcs"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_SERVICE_ACCOUNT_KEY: ${GCS_SERVICE_ACCOUNT_KEY:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      # Phase 2 integrations - read from env, unused in Phase 1
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-}
      SHOPIFY_ADMIN_API_TOKEN: ${SHOPIFY_ADMIN_API_TOKEN:-}
      SHOPIFY_API_SCOPES: ${SHOPIFY_API_SCOPES:-}
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "3001"
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks: [internal]
    depends_on:
      - backend

volumes:
  postgres_data:
    name: cepco-mc2-postgres
  uploads_data:
    name: cepco-mc2-uploads

networks:
  internal:
