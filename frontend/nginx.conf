server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Beachhead polls this over HTTPS after startup.
    # No URI part after the variable: with a variable proxy_pass nginx forwards
    # the original request URI unchanged, and the backend serves /healthz at
    # the same path. Appending one here would change that behaviour.
    location = /healthz {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location /api/ {
        # nginx resolves proxy_pass hostnames at config load time, which crashes
        # the container when the backend isn't up yet. Docker's embedded DNS
        # resolver plus a variable defers resolution to request time.
        # ipv6=off is required: without it AAAA lookups return SERVFAIL.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No websocket upgrade headers: the API is plain REST, and sending
        # Connection: upgrade on every request confuses keep-alive.

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — vue-router handles the rest.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
